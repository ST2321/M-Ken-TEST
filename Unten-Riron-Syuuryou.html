            <div class="math-block">R<sub>r</sub> = r<sub>r</sub> × W</div>
            <strong>3. 引張力（F）：</strong>
            <div class="math-block">F = R = R<sub>r</sub> + R<sub>g</sub> (R<sub>g</sub> = 9.8 × i × W)</div>
            <strong>4. 非常制動（勾配補正）：</strong>
            <div class="math-block">&beta;&apos; = &beta; + (9.8 × i) / 305.6</div>

<script>
const allowedSpeeds = [15, 25, 45, 60, 75, 90];

function getRandomSpeed() {
    return allowedSpeeds[Math.floor(Math.random() * allowedSpeeds.length)];
}

function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function parseKilometer(str) {
    if (!str) return NaN;
    let match = str.toUpperCase().match(/^(\d+)K(\d+)M?$/);
    if (match) {
        return parseInt(match[1], 10) * 1000 + parseInt(match[2], 10);
    }
    let num = Number(str);
    if (!isNaN(num)) return num;
    return NaN;
}

function formatKilometer(totalMeters) {
    let km = Math.floor(totalMeters / 1000);
    let m = totalMeters % 1000;
    return `${km}K${String(m).padStart(3, '0')}M`;
}

function generateDynamicProblem(category) {
    if (category === '力行・定速') {
        const subType = Math.random() < 0.5 ? 1 : 2;
        const alpha = (Math.floor(Math.random() * 5) + 1) * 0.5;
        const v = getRandomSpeed();

        if (subType === 1) {
            const ans = Math.ceil(v / alpha);
            return {
                id: 'q1_1',
                title: '力行・定速',
                category: '力行・定速',
                text: `電車が出発後、平均加速度 ${alpha} km/h/s で力行し、${v} km/h で定速運転とした。出発から定速運転に入るまでの所要時間を求めよ。ただし, 解はすべて切り上げ整数のこと。`,
                answer: ans,
                isKm: false,
                formula: '<strong>【使用する公式】</strong><div class="math-block">t = V / &alpha;</div>',
                calcAndAnswer: `<strong>【計算式】</strong>
                    <div class="math-block">
                        <div class="calc-block">
                            <div class="calc-row"><span class="calc-label">t</span><span class="calc-symbol">=</span><span class="calc-content">${v} / ${alpha}</span></div>
                            <div class="calc-row"><span class="calc-label"></span><span class="calc-symbol">=</span><span class="calc-content">${v / alpha} 秒</span></div>
                        </div>
                    </div>
                    <div style="margin-top:4px; font-weight:bold; color:var(--primary-color);">A: ${ans} 秒</div>`
            };
        } else {
            const accelDist = getRandomInt(100, 300);
            const totalDist = accelDist + getRandomInt(100, 400);
            const t1 = v / alpha;
            const dist1 = (v * v) / (7.2 * alpha);
            const constDist = totalDist - dist1;
            const t2 = constDist > 0 ? (constDist * 3.6) / v : 0;
            const totalT = Math.ceil(t1 + t2);

            return {
                id: 'q1_2',
                title: '力行・定速',
                category: '力行・定速',
                text: `電車が平均加速度 ${alpha} km/h/s で力行し、${v} km/h で定速運転としたとき、出発から ${totalDist} m 走行した時点までの所要時間を求めよ。ただし, 解はすべて切り上げ整数のこと。`,
                answer: totalT,
                isKm: false,
                formula: '<strong>【使用する公式】</strong><div class="math-block">s = V<sup>2</sup> / (7.2&alpha;) + (V &times; t<sub>c</sub>) / 3.6</div>',
                calcAndAnswer: `<strong>【計算式】</strong>
                    <div class="math-block">
                        <div class="calc-block">
                            <div class="calc-row"><span class="calc-label">加速距離</span><span class="calc-symbol">=</span><span class="calc-content">${v}<sup>2</sup> / (7.2 &times; ${alpha}) ≒ ${dist1.toFixed(1)} m</span></div>
                            <div class="calc-row"><span class="calc-label">定速距離</span><span class="calc-symbol">=</span><span class="calc-content">${totalDist} - ${dist1.toFixed(1)} = ${constDist.toFixed(1)} m</span></div>
                            <div class="calc-row"><span class="calc-label">定速時間</span><span class="calc-symbol">=</span><span class="calc-content">(${constDist.toFixed(1)} &times; 3.6) / ${v} ≒ ${t2.toFixed(1)} 秒</span></div>
                            <div class="calc-row"><span class="calc-label">総時間</span><span class="calc-symbol">=</span><span class="calc-content">${t1.toFixed(1)} + ${t2.toFixed(1)} = ${(t1+t2).toFixed(1)} 秒</span></div>
                        </div>
                    </div>
                    <div style="margin-top:4px; font-weight:bold; color:var(--primary-color);">A: ${totalT} 秒</div>`
            };
        }
    } else if (category === '走行抵抗・張引力') {
        const subType = Math.random() < 0.5 ? 1 : 2;
        const mMass = getRandomInt(30, 40);
        const tMass = getRandomInt(20, 30);
        const mRes = getRandomInt(30, 45) + 0.5;
        const tRes = getRandomInt(20, 32) + 0.5;
        const grade = getRandomInt(10, 30);
        const v = getRandomSpeed();

        const mCount = 3;
        const tCount = 3;
        const totalMWeight = mMass * mCount;
        const totalTWeight = tMass * tCount;
        const totalWeight = totalMWeight + totalTWeight;

        const rR = (mRes * totalMWeight) + (tRes * totalTWeight);

        if (subType === 1) {
            const ans = Math.round(rR);
            return {
                id: 'q2_1',
                title: '走行抵抗・張引力',
                category: '走行抵抗・張引力',
                text: `列車編成 3M3T、一両当たりの質量（M車 ${mMass} t、T車 ${tMass} t）、単位質量当たりの走行抵抗（M車 ${mRes} N/t、T車 ${tRes} N/t）の列車が、+${grade} ‰ の直線路上を ${v} km/h の一定の速度で運転していた。この時の列車の走行抵抗 Rᵣ はいくらか。`,
                answer: ans,
                isKm: false,
                formula: '<strong>【使用する公式】</strong><div class="math-block">R<sub>r</sub> = r<sub>r</sub> &times; W</div>',
                calcAndAnswer: `<strong>【計算式】</strong>
                    <div class="math-block">
                        <div class="calc-block">
                            <div class="calc-row"><span class="calc-label">M車抵抗</span><span class="calc-symbol">=</span><span class="calc-content">${mRes} &times; ${mMass} &times; ${mCount} = ${mRes * totalMWeight} N</span></div>
                            <div class="calc-row"><span class="calc-label">T車抵抗</span><span class="calc-symbol">=</span><span class="calc-content">${tRes} &times; ${tMass} &times; ${tCount} = ${tRes * totalTWeight} N</span></div>
                            <div class="calc-row"><span class="calc-label">合計($R_r$)</span><span class="calc-symbol">=</span><span class="calc-content">${rR} N</span></div>
                        </div>
                    </div>
                    <div style="margin-top:4px; font-weight:bold; color:var(--primary-color);">A: ${ans} N</div>`
            };
        } else {
            const rG = 9.8 * grade * totalWeight;
            const f = rR + rG;
            const ans = Math.round(f);
            return {
                id: 'q2_2',
                title: '走行抵抗・張引力',
                category: '走行抵抗・張引力',
                text: `列車編成 3M3T（M車 ${mMass} t・${mRes} N/t、T車 ${tMass} t・${tRes} N/t）、+${grade} ‰ 勾配、${v} km/h 定速の条件において、この時の列車の引張力 F はいくらか。`,
                answer: ans,
                isKm: false,
                formula: '<strong>【使用する公式】</strong><div class="math-block">F = R = R<sub>r</sub> + R<sub>g</sub><br>R<sub>g</sub> = 9.8 &times; i &times; W</div>',
                calcAndAnswer: `<strong>【計算式】</strong>
                    <div class="math-block">
                        <div class="calc-block">
                            <div class="calc-row"><span class="calc-label">総重量($W$)</span><span class="calc-symbol">=</span><span class="calc-content">(${mMass} &times; 3) + (${tMass} &times; 3) = ${totalWeight} t</span></div>
                            <div class="calc-row"><span class="calc-label">走行抵抗($R_r$)</span><span class="calc-symbol">=</span><span class="calc-content">${rR} N</span></div>
                            <div class="calc-row"><span class="calc-label">勾配抵抗($R_g$)</span><span class="calc-symbol">=</span><span class="calc-content">9.8 &times; ${grade} &times; ${totalWeight} = ${rG.toFixed(1)} N</span></div>
                            <div class="calc-row"><span class="calc-label">引張力($F$)</span><span class="calc-symbol">=</span><span class="calc-content">${rR} + ${rG.toFixed(1)} = ${f.toFixed(1)} N</span></div>
                        </div>
                    </div>
                    <div style="margin-top:4px; font-weight:bold; color:var(--primary-color);">A: ${ans} N</div>`
            };
        }
    } else {
        const v = getRandomSpeed();
        const beta = (Math.floor(Math.random() * 3) + 2) * 0.5;
        const t0 = getRandomInt(1, 3);
        const grade = (Math.floor(Math.random() * 5) + 1) * 0.5;
        
        const baseKM = 1;
        const baseM = 447;

        const betaPrime = beta + (9.8 * grade) / 305.6;
        const idleDist = (v * t0) / 3.6;
        const brakeDist = (v * v) / (7.2 * betaPrime);
        const totalDist = Math.ceil(idleDist + brakeDist);

        let totalMeters = baseKM * 1000 + baseM - totalDist;
        const bKM = Math.floor(totalMeters / 1000);
        const bM = totalMeters % 1000;
        const ansMeters = totalMeters;

        const diagramHtml = `
            <div class="visual-diagram">
                <div class="diag-inner">
                    <div class="diag-station-a">A駅</div>
                    <div class="diag-box-b">B</div>
                    <div class="diag-track"></div>
                    <div class="diag-track-label">線路</div>
                    
                    <div class="diag-platform-box">6</div>
                    <div class="diag-vertical-line1"></div>
                    <div class="diag-km-label">1K447M</div>

                    <div class="diag-vertical-line2"></div>
                    <div class="diag-sub-km">0K810M</div>

                    <div class="diag-slope-line"></div>
                    <div class="diag-grade-1">+${grade}</div>
                    <div class="diag-grade-2">-20</div>
                    <div class="diag-grade-text">こう配</div>
                </div>
            </div>
        `;

        return {
            id: 'q3_1',
            title: '勾配抵抗・キロ程',
            category: '勾配抵抗・キロ程',
            text: `直線路上を ${v} km/h で走行中の列車を、<span class="target-box">B</span>地点からブレーキを投入し、図のA駅<span class="framed-number">6</span>地点（1K447M）に停止させる。<span class="target-box">B</span>地点のキロ程を求めよ。ただし、ブレーキによって生じる減速度は ${beta} km/h/s、空走時間は ${t0} 秒、滑走はないものとする。勾配はA駅側から +${grade} ‰、途中 0K810M 地点から -20 ‰ とする。<br>` + diagramHtml,
            answer: ansMeters,
            isKm: true,
            formula: '<strong>【使用する公式】</strong><div class="math-block">s = (V_1 &times; t_0) / 3.6 + V_1^2 / (7.2 &times; &beta;&apos;)<br>&beta;&apos; = &beta; + (9.8 &times; i) / 305.6</div>',
            calcAndAnswer: `<strong>【計算式】</strong>
                <div class="math-block">
                    <div class="calc-block">
                        <div class="calc-row"><span class="calc-label">実効減速度(&beta;&apos;)</span><span class="calc-symbol">=</span><span class="calc-content">${beta} + (9.8 &times; ${grade}) / 305.6 ≒ ${betaPrime.toFixed(3)} km/h/s</span></div>
                        <div class="calc-row"><span class="calc-label">空走距離</span><span class="calc-symbol">=</span><span class="calc-content">(${v} &times; ${t0}) / 3.6 ≒ ${idleDist.toFixed(2)} m</span></div>
                        <div class="calc-row"><span class="calc-label">制動距離</span><span class="calc-symbol">=</span><span class="calc-content">${v}<sup>2</sup> / (7.2 &times; ${betaPrime.toFixed(3)}) ≒ ${brakeDist.toFixed(2)} m</span></div>
                        <div class="calc-row"><span class="calc-label">総停止距離(s)</span><span class="calc-symbol">=</span><span class="calc-content">${idleDist.toFixed(2)} + ${brakeDist.toFixed(2)} = ${totalDist} m</span></div>
                        <div class="calc-row"><span class="calc-label">B地点キロ程</span><span class="calc-symbol">=</span><span class="calc-content">${baseKM}K${baseM}M - ${totalDist}m = ${bKM}K${String(bM).padStart(3,'0')}M</span></div>
                    </div>
                </div>
                <div style="margin-top:4px; font-weight:bold; color:var(--primary-color);">A: ${bKM}K${String(bM).padStart(3,'0')}M</div>`
        };
    }
}

let currentMode = 'practice';
let currentProblem = null;
let isQuestionActive = false;

let practiceList = [];
let practiceIndex = 0;
let practiceResults = [];
let currentDetailIndex = null;

let freeRetryProblem = null;
let isFreeRetrySession = false;

let isBatchRetrySession = false;
let batchRetryQueue = [];
let batchRetryOriginalIndices = [];
let batchRetryCurrentStep = 0;

function updateGenerateButtonText() {
    const generateBtn = document.getElementById('generateBtn');
    if (isQuestionActive) {
        generateBtn.textContent = '問題生成';
    } else {
        generateBtn.textContent = '練習を開始する';
    }
}

function updateNumpadLayout() {
    const kmControlBar = document.getElementById('kmControlBar');
    if (currentProblem && currentProblem.isKm) {
        kmControlBar.style.display = 'flex';
    } else {
        kmControlBar.style.display = 'none';
    }
}

function resetPlatformDisplay() {
    isQuestionActive = false;
    currentProblem = null;
    freeRetryProblem = null;
    isFreeRetrySession = false;
    isBatchRetrySession = false;
    batchRetryQueue = [];
    batchRetryOriginalIndices = [];
    batchRetryCurrentStep = 0;
    
    document.getElementById('questionText').style.display = 'none';
    document.getElementById('inputArea').style.display = 'none';
    document.getElementById('numpadArea').style.display = 'none';
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('summaryDashboard').style.display = 'none';
    
    document.getElementById('settingsCard').style.display = 'flex';
    document.getElementById('formulaSummaryCard').style.display = 'block';
    document.getElementById('userAnswer').value = '';

    document.getElementById('subjectSelectBtn').style.display = 'inline-block';
    document.getElementById('exitBtn').style.display = 'none';
    updateGenerateButtonText();
}

function getSelectedCount() {
    const activeCountBtn = document.querySelector('#countButtonGroup .select-btn.active');
    if (activeCountBtn) {
        return parseInt(activeCountBtn.getAttribute('data-count'), 10);
    }
    const customInput = document.getElementById('customCountInput');
    let val = parseInt(customInput.value, 10);
    if (isNaN(val) || val <= 0) {
        return 5;
    }
    return val;
}

function generateRandomProblem() {
    const activeTypeBtns = document.querySelectorAll('#typeButtonGroup .select-btn.active');
    let categories = [];
    activeTypeBtns.forEach(btn => {
        let t = btn.getAttribute('data-type');
        if (t !== 'all') {
            categories.push(t);
        }
    });

    if (categories.length === 0) {
        categories = ['力行・定速', '走行抵抗・張引力', '勾配抵抗・キロ程'];
    }

    let cat = categories[Math.floor(Math.random() * categories.length)];
    return generateDynamicProblem(cat);
}

function startPlatform() {
    currentMode = document.querySelector('#modeButtonGroup .select-btn.active').getAttribute('data-mode');

    const activeTypeBtns = document.querySelectorAll('#typeButtonGroup .select-btn.active');
    if (activeTypeBtns.length === 0) {
        alert("出題形式を少なくとも1つ選択してください。");
        return;
    }

    document.getElementById('summaryDashboard').style.display = 'none';
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('settingsCard').style.display = 'none';
    document.getElementById('formulaSummaryCard').style.display = 'block';
    
    const qBox = document.getElementById('questionText');
    qBox.style.display = 'block';
    qBox.className = 'question-box';

    document.getElementById('subjectSelectBtn').style.display = 'none';
    document.getElementById('exitBtn').style.display = 'inline-block';

    if (currentMode === 'practice') {
        document.getElementById('inputArea').style.display = 'flex';
        document.getElementById('numpadArea').style.display = 'flex';
        isQuestionActive = true;
        isFreeRetrySession = false;
        isBatchRetrySession = false;
        freeRetryProblem = null;
        updateGenerateButtonText();

        currentProblem = generateRandomProblem();
        updateNumpadLayout();
        qBox.innerHTML = `<strong>【${currentProblem.title}】</strong><br>` + currentProblem.text;
    } else {
        const count = getSelectedCount();
        practiceList = [];
        for (let i = 0; i < count; i++) {
            practiceList.push(generateRandomProblem());
        }
        practiceIndex = 0;
        practiceResults = [];

        document.getElementById('inputArea').style.display = 'flex';
        document.getElementById('numpadArea').style.display = 'flex';
        isQuestionActive = true;
        isFreeRetrySession = false;
        isBatchRetrySession = false;
        freeRetryProblem = null;
        updateGenerateButtonText();

        loadExamQuestion();
    }
}

function loadExamQuestion() {
    currentProblem = practiceList[practiceIndex];
    updateNumpadLayout();
    document.getElementById('questionText').innerHTML = `<strong>【第 ${practiceIndex + 1} 問 / 全 ${practiceList.length} 問 - ${currentProblem.title}】</strong><br>` + currentProblem.text;
    document.getElementById('userAnswer').value = '';
}

function checkAnswer() {
    const userAnsVal = document.getElementById('userAnswer').value.trim();
    if (userAnsVal === "") {
        alert("答えを入力してください。");
        return;
    }

    let targetProb = isFreeRetrySession ? freeRetryProblem : currentProblem;
    let userAns;

    if (targetProb.isKm) {
        userAns = parseKilometer(userAnsVal);
        if (isNaN(userAns)) {
            alert("キロ程の形式（例: 1K006M）で入力してください。");
            return;
        }
    } else {
        try {
            let sanitized = userAnsVal.replace(/[^0-9\+\-\*/().]/g, '');
            userAns = Number(eval(sanitized));
        } catch (e) {
            alert("正しい数値を入力してください。");
            return;
        }
    }

    if (currentMode === 'practice') {
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const explanationText = document.getElementById('explanationText');
        const nextBtn = document.getElementById('nextBtn');
        const retrySameBtn = document.getElementById('retrySameBtn');

        resultBox.style.display = 'block';

        let isCorrect = Math.abs(userAns - targetProb.answer) < 1.0;

        if (isFreeRetrySession) {
            if (isCorrect) {
                resultBox.className = 'result-box';
                resultBox.style.backgroundColor = 'var(--retry-success-bg)';
                resultBox.style.color = 'var(--retry-success-color)';
                resultBox.style.border = '1px solid var(--retry-success-border)';
                resultTitle.textContent = '再挑戦：○ 正解';
            } else {
                resultBox.className = 'result-box incorrect';
                resultBox.style.backgroundColor = '';
                resultBox.style.color = '';
                resultBox.style.border = '';
                resultTitle.textContent = '再挑戦：✕ 不正解';
            }
        } else {
            if (isCorrect) {
                resultBox.className = 'result-box correct';
                resultTitle.textContent = '◎ 正解';
            } else {
                resultBox.className = 'result-box incorrect';
                resultTitle.textContent = '✕ 不正解';
            }
        }

        nextBtn.style.display = 'block';
        retrySameBtn.style.display = 'block';

        if (isCorrect) {
            explanationText.innerHTML = `${targetProb.formula}${targetProb.calcAndAnswer}`;
        } else {
            explanationText.innerHTML = `${targetProb.formula}<button class="btn btn-reveal" id="revealBtn">計算式と解答を表示</button><div id="hiddenCalcContainer" style="display:none;">${targetProb.calcAndAnswer}</div>`;
            const revealBtn = document.getElementById('revealBtn');
            revealBtn.addEventListener('click', () => {
                document.getElementById('hiddenCalcContainer').style.display = 'block';
                revealBtn.style.display = 'none';
            });
        }

        resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });

    } else {
        let isCorrect = Math.abs(userAns - targetProb.answer) < 1.0;
        let displayUserAnsStr = targetProb.isKm ? formatKilometer(userAns) : userAns;

        if (isBatchRetrySession) {
            let origIdx = batchRetryOriginalIndices[batchRetryCurrentStep];
            let resObj = practiceResults[origIdx];

            resObj.retryCorrect = isCorrect;
            resObj.lastUserAnsStr = displayUserAnsStr;

            if (!resObj.retryHistory) {
                resObj.retryHistory = [];
            }
            resObj.retryHistory.push({
                userAnsStr: displayUserAnsStr,
                isCorrect: isCorrect
            });

            batchRetryCurrentStep++;
            if (batchRetryCurrentStep < batchRetryQueue.length) {
                loadExamQuestion();
            } else {
                isBatchRetrySession = false;
                showExamSummary();
            }
        } else {
            practiceResults.push({
                question: currentProblem,
                userAnsStr: displayUserAnsStr,
                userAnsNum: userAns,
                isCorrect: isCorrect,
                retryCorrect: null,
                retryHistory: []
            });

            practiceIndex++;
            if (practiceIndex < practiceList.length) {
                loadExamQuestion();
            } else {
                showExamSummary();
            }
        }
    }
}

function updateScoreCard() {
    const correctCount = practiceResults.filter(r => r.isCorrect || r.retryCorrect === true).length;
    const total = practiceResults.length;
    document.getElementById('scoreCardText').textContent = `結果： ${total}問中 ${correctCount}問正解 （正答率: ${Math.round((correctCount/total)*100)}%）`;
}

function renderResultGrid() {
    const grid = document.getElementById('resultGrid');
    grid.innerHTML = '';

    practiceResults.forEach((res, idx) => {
        const badge = document.createElement('div');
        let statusClass = res.isCorrect ? 'correct' : 'incorrect';
        let mark = res.isCorrect ? '◎' : '✕';

        if (!res.isCorrect && res.retryCorrect === true) {
            statusClass = 'retry-correct';
            mark = '○';
        } else if (!res.isCorrect && res.retryCorrect === false) {
            mark = '✕';
        }

        badge.className = `result-item-badge ${statusClass}`;
        badge.textContent = `${idx + 1}問 [${mark}]`;
        badge.addEventListener('click', () => {
            showExamDetail(idx);
        });
        grid.appendChild(badge);
    });

    const retryWrongBtn = document.getElementById('retryWrongBtn');
    const hasIncorrect = practiceResults.some(r => !r.isCorrect && r.retryCorrect !== true);
    if (hasIncorrect && currentMode === 'exam') {
        retryWrongBtn.style.display = 'block';
    } else {
        retryWrongBtn.style.display = 'none';
    }
}

function showExamSummary() {
    document.getElementById('questionText').style.display = 'none';
    document.getElementById('inputArea').style.display = 'none';
    document.getElementById('numpadArea').style.display = 'none';
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('exitBtn').style.display = 'none';
    document.getElementById('subjectSelectBtn').style.display = 'none';

    const dashboard = document.getElementById('summaryDashboard');
    dashboard.style.display = 'block';

    updateScoreCard();
    renderResultGrid();
    showExamDetail(0);
    dashboard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showExamDetail(idx) {
    currentDetailIndex = idx;
    const res = practiceResults[idx];
    const detailCard = document.getElementById('detailViewCard');
    detailCard.style.display = 'block';

    document.getElementById('detailTitle').textContent = `第 ${idx + 1} 問 の詳細`;
    document.getElementById('detailQuestion').innerHTML = `問題： ${res.question.text}`;

    let initialMark = res.isCorrect ? '◎' : '✕';
    let initialColor = res.isCorrect ? 'var(--success-color)' : 'var(--error-color)';

    document.getElementById('detailUserAns').innerHTML = `あなたの回答: <strong>${res.userAnsStr}</strong> - <span style="color:${initialColor}; font-weight:bold;">${initialMark}</span>`;

    const historyContainer = document.getElementById('detailHistoryContainer');
    historyContainer.innerHTML = '';
    if (res.retryHistory && res.retryHistory.length > 0) {
        res.retryHistory.forEach((hItem, hIdx) => {
            let hMark = hItem.isCorrect ? '○' : '✕';
            let hColor = hItem.isCorrect ? 'var(--retry-success-color)' : 'var(--error-color)';

            const historyDiv = document.createElement('div');
            historyDiv.style.marginTop = '8px';
            historyDiv.style.padding = '8px';
            historyDiv.style.background = '#f8f9fa';
            historyDiv.style.borderLeft = '3px solid #f29900';
            historyDiv.style.borderRadius = '0 4px 4px 0';
            historyDiv.style.fontSize = '0.95rem';
            historyDiv.innerHTML = `再挑戦(${hIdx + 1}): <strong>${hItem.userAnsStr}</strong> - <span style="color:${hColor}; font-weight:bold;">${hMark}</span>`;
            historyContainer.appendChild(historyDiv);
        });
    }

    if (res.isCorrect || res.retryCorrect === true) {
        document.getElementById('detailExplanationText').innerHTML = `${res.question.formula}${res.question.calcAndAnswer}`;
    } else {
        document.getElementById('detailExplanationText').innerHTML = `${res.question.formula}<button class="btn btn-reveal" id="detailRevealBtn">計算式と解答を表示</button><div id="detailHiddenCalcContainer" style="display:none;">${res.question.calcAndAnswer}</div>`;
        const detailRevealBtn = document.getElementById('detailRevealBtn');
        detailRevealBtn.addEventListener('click', () => {
            document.getElementById('detailHiddenCalcContainer').style.display = 'block';
            detailRevealBtn.style.display = 'none';
        });
    }

    const detailRetryBtn = document.getElementById('detailRetryBtn');
    if (!res.isCorrect && res.retryCorrect !== true && currentMode === 'exam') {
        detailRetryBtn.style.display = 'block';
    } else {
        detailRetryBtn.style.display = 'none';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const modeButtons = document.querySelectorAll('#modeButtonGroup .select-btn');
    const typeButtons = document.querySelectorAll('#typeButtonGroup .select-btn');
    const countButtons = document.querySelectorAll('#countButtonGroup .select-btn');
    const customCountInput = document.getElementById('customCountInput');
    const customCountWrapper = document.getElementById('customCountWrapper');
    const countRow = document.getElementById('countRow');
    const modeDescText = document.getElementById('modeDescText');

    const generateBtn = document.getElementById('generateBtn');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const retrySameBtn = document.getElementById('retrySameBtn');
    const practiceExitBtn = document.getElementById('practiceExitBtn');
    const retryWrongBtn = document.getElementById('retryWrongBtn');
    const detailRetryBtn = document.getElementById('detailRetryBtn');
    const exitBtn = document.getElementById('exitBtn');
    const userAnswerInput = document.getElementById('userAnswer');

    const subjectSelectBtn = document.getElementById('subjectSelectBtn');
    if (subjectSelectBtn) {
        subjectSelectBtn.style.display = 'inline-block';
    }
    if (exitBtn) {
        exitBtn.style.display = 'none';
    }

    modeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            modeButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.getAttribute('data-mode');

            if (currentMode === 'practice') {
                countRow.style.display = 'none';
                modeDescText.textContent = '一問ごとに解説が表示されます。';
            } else {
                countRow.style.display = 'flex';
                modeDescText.textContent = '最後に解説がまとめて表示されます。';
            }
            resetPlatformDisplay();
        });
    });

    countRow.style.display = 'none';

    typeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const type = btn.getAttribute('data-type');
            const allBtn = document.querySelector('#typeButtonGroup .select-btn[data-type="all"]');
            const subBtns = document.querySelectorAll('#typeButtonGroup .select-btn:not([data-type="all"])');

            if (type === 'all') {
                typeButtons.forEach(b => b.classList.remove('active'));
                allBtn.classList.add('active');
            } else {
                allBtn.classList.remove('active');
                btn.classList.toggle('active');

                const anyChecked = Array.from(subBtns).some(b => b.classList.contains('active'));
                if (!anyChecked) {
                    allBtn.classList.add('active');
                }
            }
        });
    });

    countButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            countButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            customCountWrapper.classList.remove('active');
            customCountInput.value = '';
        });
    });

    customCountWrapper.addEventListener('click', () => {
        countButtons.forEach(b => b.classList.remove('active'));
        customCountWrapper.classList.add('active');
        customCountInput.value = '';
        customCountInput.focus();
    });

    customCountInput.addEventListener('focus', () => {
        countButtons.forEach(b => b.classList.remove('active'));
        customCountWrapper.classList.add('active');
        customCountInput.value = '';
    });

    customCountInput.addEventListener('input', () => {
        if (customCountInput.value !== '') {
            countButtons.forEach(b => b.classList.remove('active'));
            customCountWrapper.classList.add('active');
        }
    });

    if (generateBtn) {
        generateBtn.addEventListener('click', startPlatform);
    }

    if (exitBtn) {
        exitBtn.addEventListener('click', resetPlatformDisplay);
    }

    if (practiceExitBtn) {
        practiceExitBtn.addEventListener('click', resetPlatformDisplay);
    }

    if (submitBtn) {
        submitBtn.addEventListener('click', () => {
            if (currentMode === 'practice') {
                checkAnswer();
            } else {
                if (isFreeRetrySession) {
                    const userAnsVal = userAnswerInput.value.trim();
                    if (userAnsVal === "") {
                        alert("数値を入力するか、計算結果を求めてください。");
                        return;
                    }
                    let targetProb = freeRetryProblem;
                    let userAns;

                    if (targetProb.isKm) {
                        userAns = parseKilometer(userAnsVal);
                        if (isNaN(userAns)) {
                            alert("キロ程の形式（例: 1K006M）で入力してください。");
                            return;
                        }
                    } else {
                        try {
                            let sanitized = userAnsVal.replace(/[^0-9\+\-\*/().]/g, '');
                            userAns = Number(eval(sanitized));
                        } catch (e) {
                            alert("正しい数値を入力してください。");
                            return;
                        }
                    }

                    let isCorrect = Math.abs(userAns - targetProb.answer) < 1.0;
                    let displayUserAnsStr = targetProb.isKm ? formatKilometer(userAns) : userAns;

                    const res = practiceResults[currentDetailIndex];
                    res.retryCorrect = isCorrect;
                    res.lastUserAnsStr = displayUserAnsStr;

                    if (!res.retryHistory) {
                        res.retryHistory = [];
                    }
                    res.retryHistory.push({
                        userAnsStr: displayUserAnsStr,
                        isCorrect: isCorrect
                    });

                    document.getElementById('questionText').style.display = 'none';
                    document.getElementById('inputArea').style.display = 'none';
                    document.getElementById('numpadArea').style.display = 'none';
                    document.getElementById('resultBox').style.display = 'none';
                    document.getElementById('exitBtn').style.display = 'none';

                    const dashboard = document.getElementById('summaryDashboard');
                    dashboard.style.display = 'block';

                    updateScoreCard();
                    renderResultGrid();
                    showExamDetail(currentDetailIndex);
                    dashboard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    isFreeRetrySession = false;
                } else {
                    checkAnswer();
                }
            }
        });
    }

    if (detailRetryBtn) {
        detailRetryBtn.addEventListener('click', () => {
            if (currentDetailIndex === null) return;
            const res = practiceResults[currentDetailIndex];

            document.getElementById('summaryDashboard').style.display = 'none';
            document.getElementById('questionText').style.display = 'block';
            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('numpadArea').style.display = 'flex';
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('exitBtn').style.display = 'inline-block';

            isFreeRetrySession = true;
            freeRetryProblem = res.question;
            currentProblem = res.question;
            updateNumpadLayout();

            document.getElementById('questionText').innerHTML = `<strong>【問題の再挑戦】</strong><br>` + res.question.text;
            userAnswerInput.value = '';
            document.getElementById('questionText').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    }

    if (retrySameBtn) {
        retrySameBtn.addEventListener('click', () => {
            document.getElementById('resultBox').style.display = 'none';
            userAnswerInput.value = '';
            isFreeRetrySession = false;
            
            document.getElementById('questionText').innerHTML = `<strong>【${currentProblem.title}】</strong><br>` + currentProblem.text;
            document.getElementById('questionText').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    }

    if (nextBtn) {
        nextBtn.addEventListener('click', () => {
            document.getElementById('resultBox').style.display = 'none';
            userAnswerInput.value = '';
            isFreeRetrySession = false;
            freeRetryProblem = null;

            currentProblem = generateRandomProblem();
            updateNumpadLayout();
            document.getElementById('questionText').innerHTML = `<strong>【${currentProblem.title}】</strong><br>` + currentProblem.text;
            document.getElementById('questionText').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    }

    if (retryWrongBtn) {
        retryWrongBtn.addEventListener('click', () => {
            batchRetryQueue = [];
            batchRetryOriginalIndices = [];

            practiceResults.forEach((res, idx) => {
                if (!res.isCorrect && res.retryCorrect !== true) {
                    batchRetryQueue.push(res.question);
                    batchRetryOriginalIndices.push(idx);
                }
            });

            if (batchRetryQueue.length > 0) {
                isBatchRetrySession = true;
                batchRetryCurrentStep = 0;

                document.getElementById('summaryDashboard').style.display = 'none';
                document.getElementById('questionText').style.display = 'block';
                document.getElementById('inputArea').style.display = 'flex';
                document.getElementById('numpadArea').style.display = 'flex';
                document.getElementById('resultBox').style.display = 'none';
                document.getElementById('exitBtn').style.display = 'inline-block';

                loadExamQuestion();
                document.getElementById('questionText').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    }

    const numpadButtons = document.querySelectorAll('.num-btn');
    numpadButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const val = btn.getAttribute('data-val');

            if (val === 'clear') {
                userAnswerInput.value = '';
            } else if (val === 'back') {
                userAnswerInput.value = userAnswerInput.value.slice(0, -1);
            } else if (val === 'calc') {
                try {
                    let sanitized = userAnswerInput.value.replace(/[^0-9\+\-\*/().]/g, '');
                    if (sanitized !== '') {
                        let evaluated = eval(sanitized);
                        userAnswerInput.value = evaluated;
                    }
                } catch (e) {
                    alert("計算式の値が無効です。");
                }
            } else {
                userAnswerInput.value += val;
            }
        });
    });
});
</script>

</body>
</html>
