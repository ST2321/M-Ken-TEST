<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>運転理論 練習問題プラットフォーム</title>
<style>
:root {
    --primary-color: #1a73e8;
    --secondary-color: #e8f0fe;
    --success-color: #34a853;
    --error-color: #ea4335;
    --retry-success-bg: #fef7e0;
    --retry-success-color: #b06000;
    --retry-success-border: #fef0c7;
    --bg-color: #f8f9fa;
    --card-bg: #ffffff;
    --text-color: #202124;
}

body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    box-sizing: border-box;
    -webkit-text-size-adjust: 100%;
}

.container {
    width: 100%;
    max-width: 800px;
    background: var(--card-bg);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    box-sizing: border-box;
    margin-top: 10px;
    margin-bottom: 20px;
}

.header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    position: relative;
}

h1 {
    font-size: 1.3rem;
    color: var(--primary-color);
    margin: 0;
    text-align: center;
    flex: 1;
}

.btn-exit {
    background-color: #5f6368;
    color: white;
    border: none;
    padding: 6px 12px;
    font-size: 0.85rem;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.2s;
    -webkit-appearance: none;
    touch-action: manipulation;
}

.btn-exit:hover {
    background-color: #3c4043;
}

.formula-summary {
    background: #f8f9fa;
    border: 1px solid #dadce0;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 0.85rem;
    line-height: 1.6;
}

.formula-summary summary {
    font-weight: bold;
    color: var(--primary-color);
    cursor: pointer;
}

.math-block {
    text-align: center;
    margin: 8px 0;
    font-family: serif;
    font-size: 1.1rem;
    overflow-x: auto;
}

.calc-block {
    display: inline-block;
    text-align: left;
    margin: 0 auto;
}

.calc-row {
    display: flex;
    align-items: center;
    margin: 4px 0;
    white-space: nowrap;
}

.calc-label {
    text-align: right;
    padding-right: 4px;
}

.calc-symbol {
    width: 20px;
    text-align: center;
    font-weight: bold;
}

.calc-content {
    text-align: left;
}

.fraction {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    text-align: center;
    margin: 0 4px;
}

.numerator {
    border-bottom: 1px solid #000;
    padding-bottom: 1px;
}

.denominator {
    padding-top: 1px;
}

.settings-card {
    background: var(--secondary-color);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.setting-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

@media (min-width: 500px) {
    .setting-row {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
    }
}

.settings-card label {
    font-size: 0.9rem;
    font-weight: bold;
    padding-top: 6px;
}

.button-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    width: 100%;
}

@media (min-width: 500px) {
    .button-group {
        width: auto;
        justify-content: flex-end;
        max-width: 450px;
    }
}

.select-btn {
    background-color: #fff;
    color: var(--text-color);
    border: 1px solid #ccc;
    padding: 8px 12px;
    font-size: 0.9rem;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-appearance: none;
    touch-action: manipulation;
    white-space: nowrap;
    flex: 1;
    text-align: center;
    min-width: 120px;
}

.select-btn.active {
    background-color: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
    font-weight: bold;
}

.select-btn:disabled {
    background-color: #e0e0e0;
    color: #a0a0a0;
    border-color: #d0d0d0;
    cursor: not-allowed;
}

#typeButtonGroup {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    width: 100%;
}

@media (min-width: 500px) {
    #typeButtonGroup {
        width: 380px;
    }
}

#typeButtonGroup .select-btn[data-type="all"] {
    grid-column: span 2;
    width: 100%;
}

#countButtonGroup {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    width: 100%;
}

@media (min-width: 500px) {
    #countButtonGroup {
        width: 380px;
    }
}

.custom-count-wrapper {
    display: flex;
    align-items: center;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 0 8px;
    flex: 1;
    min-width: 120px;
    box-sizing: border-box;
    cursor: pointer;
}

.custom-count-wrapper.active {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 1px var(--primary-color);
    background-color: var(--primary-color);
}

.custom-count-wrapper input {
    width: 100%;
    border: none;
    outline: none;
    font-size: 0.9rem;
    padding: 8px 0;
    text-align: center;
    background: transparent;
    -webkit-appearance: none;
    cursor: pointer;
}

.custom-count-wrapper.active input {
    color: white;
    font-weight: bold;
    cursor: text;
}

.custom-count-wrapper input::placeholder {
    color: #888;
}

.custom-count-wrapper.active input::placeholder {
    color: #e0e0e0;
}

.btn {
    background-color: var(--primary-color);
    color: white;
    border: none;
    padding: 12px 20px;
    font-size: 1rem;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.2s;
    width: 100%;
    text-align: center;
    -webkit-appearance: none;
    touch-action: manipulation;
}

.btn:hover {
    background-color: #1557b0;
}

.btn-next {
    background-color: #137333;
    margin-top: 15px;
}

.btn-next:hover {
    background-color: #0b5123;
}

.btn-retry {
    background-color: #f29900;
    margin-top: 12px;
}

.btn-retry:hover {
    background-color: #d08200;
}

.btn-reveal {
    background-color: #5f6368;
    margin-top: 10px;
    margin-bottom: 10px;
}

.btn-reveal:hover {
    background-color: #3c4043;
}

.question-box {
    font-size: 1.05rem;
    font-weight: 500;
    margin: 16px 0;
    padding: 15px;
    border-left: 5px solid var(--primary-color);
    background: #f1f3f4;
    border-radius: 0 8px 8px 0;
    word-break: break-all;
    line-height: 1.6;
}

.input-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
}

@media (min-width: 500px) {
    .input-group {
        flex-direction: row;
    }
}

.input-group input {
    flex: 1;
    padding: 12px 14px;
    font-size: 1.1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    -webkit-appearance: none;
}

.numpad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    max-width: 320px;
    margin: 0 auto 16px auto;
}

.num-btn {
    background-color: #f1f3f4;
    border: 1px solid #dadce0;
    padding: 14px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
    user-select: none;
    touch-action: manipulation;
}

.num-btn:active {
    background-color: #dadce0;
}

.num-btn.clear {
    background-color: #fce8e6;
    color: #c5221f;
    border-color: #fad2cf;
}

.num-btn.operator {
    background-color: #e8f0fe;
    color: var(--primary-color);
    border-color: #d2e3fc;
}

.num-btn.equals {
    background-color: #137333;
    color: white;
    border-color: #0b5123;
}

.result-box {
    margin-top: 16px;
    padding: 14px;
    border-radius: 8px;
    display: none;
    word-break: break-all;
}

.result-box.correct {
    background-color: #e6f4ea;
    color: var(--success-color);
    border: 1px solid #ceead6;
}

.result-box.incorrect {
    background-color: #fce8e6;
    color: var(--error-color);
    border: 1px solid #fad2cf;
}

.explanation {
    margin-top: 12px;
    font-size: 0.95rem;
    line-height: 1.8;
    color: #3c4043;
    overflow-x: auto;
}

.canvas-container {
    position: relative;
    width: 100%;
    height: 220px;
    margin-top: 15px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.summary-dashboard {
    display: none;
    margin-top: 20px;
}

.score-card {
    background: var(--secondary-color);
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    font-size: 1.2rem;
    font-weight: bold;
    margin-bottom: 20px;
    color: var(--primary-color);
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
}

.result-item-badge {
    padding: 12px 0;
    text-align: center;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    border: 1px solid #ccc;
    font-size: 1rem;
}

.result-item-badge.correct {
    background-color: #e6f4ea;
    color: var(--success-color);
    border-color: #ceead6;
}

.result-item-badge.incorrect {
    background-color: #fce8e6;
    color: var(--error-color);
    border-color: #fad2cf;
}

.result-item-badge.retry-correct {
    background-color: var(--retry-success-bg);
    color: var(--retry-success-color);
    border-color: var(--retry-success-border);
}

.detail-view-card {
    background: #fff;
    border: 1px solid #dadce0;
    padding: 15px;
    border-radius: 8px;
    margin-top: 15px;
}
</style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1>運転理論 練習問題</h1>
        <button class="btn-exit" id="exitBtn" style="display: none;">終了</button>
    </div>

    <details class="formula-summary">
        <summary>公式一覧</summary>
        <p>
            <strong>1. 等速走行の距離：</strong>
            <div class="math-block">
                s = <span class="fraction"><span class="numerator">V × t</span><span class="denominator">3.6</span></span>
            </div>
            <strong>2. 等速の速度：</strong>
            <div class="math-block">
                V = <span class="fraction"><span class="numerator">s × 3.6</span><span class="denominator">t</span></span>
            </div>
            <strong>3. 加減速の距離：</strong>
            <div class="math-block">
                加速：<br>s = <span class="fraction"><span class="numerator">V<sub>2</sub><sup>2</sup> - V<sub>1</sub><sup>2</sup></span><span class="denominator">7.2 × α</span></span>
            </div>
            <div class="math-block">
                減速：<br>s = <span class="fraction"><span class="numerator">V<sub>1</sub><sup>2</sup> - V<sub>2</sub><sup>2</sup></span><span class="denominator">7.2 × β</span></span>
            </div>
            <strong>4. 非常制動（空走距離＋制動距離）：</strong>
            <div class="math-block">
                s = <span class="fraction"><span class="numerator">V<sub>1</sub> × t<sub>0</sub></span><span class="denominator">3.6</span></span> + <span class="fraction"><span class="numerator">V<sub>1</sub><sup>2</sup></span><span class="denominator">7.2 × β</span></span>
            </div>
        </p>
    </details>

    <div class="settings-card" id="settingsCard">
        <div class="setting-row">
            <label>モード選択：</label>
            <div class="button-group" id="modeButtonGroup">
                <button type="button" class="select-btn active" data-mode="practice">練習モード</button>
                <button type="button" class="select-btn" data-mode="exam">試験モード</button>
            </div>
        </div>
        <div class="setting-row">
            <label>出題形式：</label>
            <div class="button-group" id="typeButtonGroup">
                <button type="button" class="select-btn active" data-type="all">全範囲</button>
                <button type="button" class="select-btn" data-type="distance_uniform">等速走行距離</button>
                <button type="button" class="select-btn" data-type="speed_uniform">等速速度計算</button>
                <button type="button" class="select-btn" data-type="accel">加減速距離</button>
                <button type="button" class="select-btn" data-type="emergency">非常制動停止距離</button>
            </div>
        </div>
        <div class="setting-row" id="countRow">
            <label>問題数：</label>
            <div class="button-group" id="countButtonGroup">
                <button type="button" class="select-btn" data-count="3">3問</button>
                <button type="button" class="select-btn active" data-count="5">5問</button>
                <button type="button" class="select-btn" data-count="10">10問</button>
                <div class="custom-count-wrapper" id="customCountWrapper">
                    <input type="number" id="customCountInput" min="1" max="100" placeholder="問題数指定">
                </div>
            </div>
        </div>
        <button class="btn" id="generateBtn">開始</button>
    </div>

    <div class="question-box" id="questionText" style="display: none;">
        「開始」ボタンを押してください。
    </div>

    <div class="input-group" id="inputArea" style="display: none;">
        <input type="text" id="userAnswer" placeholder="答を入力（または電卓で計算）">
        <button class="btn" id="submitBtn">回答</button>
    </div>

    <div class="numpad" id="numpadArea" style="display: none;">
        <button class="num-btn clear" data-val="clear">C</button>
        <button class="num-btn operator" data-val="(">(</button>
        <button class="num-btn operator" data-val=")">)</button>
        <button class="num-btn operator" data-val="/">÷</button>

        <button class="num-btn" data-val="7">7</button>
        <button class="num-btn" data-val="8">8</button>
        <button class="num-btn" data-val="9">9</button>
        <button class="num-btn operator" data-val="*">×</button>

        <button class="num-btn" data-val="4">4</button>
        <button class="num-btn" data-val="5">5</button>
        <button class="num-btn" data-val="6">6</button>
        <button class="num-btn operator" data-val="-">-</button>

        <button class="num-btn" data-val="1">1</button>
        <button class="num-btn" data-val="2">2</button>
        <button class="num-btn" data-val="3">3</button>
        <button class="num-btn operator" data-val="+">+</button>

        <button class="num-btn" data-val="0">0</button>
        <button class="num-btn" data-val=".">.</button>
        <button class="num-btn" data-val="back">←</button>
        <button class="num-btn equals" data-val="calc">=</button>
    </div>

    <div class="result-box" id="resultBox">
        <div id="resultTitle" style="font-weight: bold; font-size: 1.05rem; margin-bottom: 6px;"></div>
        <div class="explanation" id="explanationText"></div>
        <div class="canvas-container">
            <canvas id="vtChart"></canvas>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-retry" id="retrySameBtn" style="flex: 1; display:none;">再挑戦</button>
            <button class="btn btn-next" id="nextBtn" style="flex: 1; display:none;">次の問題</button>
        </div>
    </div>

    <div class="summary-dashboard" id="summaryDashboard">
        <div class="score-card" id="scoreCardText"></div>
        <p style="font-size: 0.9rem; font-weight: bold; margin-bottom: 8px;">問題番号を選択すると解説を表示します。：</p>
        <div class="result-grid" id="resultGrid"></div>
        <div class="detail-view-card" id="detailViewCard" style="display: none;">
            <div id="detailTitle" style="font-weight: bold; margin-bottom: 8px; color: var(--primary-color);"></div>
            <div id="detailQuestion" style="margin-bottom: 8px; font-weight: 500;"></div>
            <div id="detailUserAns" style="margin-bottom: 8px; font-size: 0.95rem;"></div>
            <div id="detailHistoryContainer"></div>
            <div class="explanation" id="detailExplanationText"></div>
            <div class="canvas-container">
                <canvas id="vtChartPractice"></canvas>
            </div>
            <button class="btn btn-retry" id="detailRetryBtn" style="display: none;">この問題を再挑戦</button>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn btn-retry" id="retryWrongBtn" style="flex: 1; display: none;">誤答を再挑戦</button>
            <button class="btn btn-exit" id="practiceExitBtn" style="flex: 1; background-color: #5f6368; padding: 12px; font-size: 1rem;">終了</button>
        </div>
    </div>
</div>

<script>
const allowedSpeeds = [15, 25, 45, 60, 75, 90];
const emergencyDecel = 4.5;

let currentMode = 'practice';
let currentProblem = null;
let isQuestionActive = false;

let practiceList = [];
let practiceIndex = 0;
let practiceResults = [];
let currentDetailIndex = null;

let freeRetryProblem = null;
let isFreeRetrySession = false;

let isBatchRetrySession = false;
let batchRetryQueue = [];
let batchRetryOriginalIndices = [];
let batchRetryCurrentStep = 0;

function getRandomItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function createFractionHtml(num, den) {
    return `<span class="fraction"><span class="numerator">${num}</span><span class="denominator">${den}</span></span>`;
}

function formatDecimalString(val) {
    let fixed = val.toFixed(3);
    let parts = fixed.split('.');
    let intPart = parts[0];
    let decPart = parts[1];
    return `${intPart}.${decPart}…`;
}

function updateGenerateButtonText() {
    const generateBtn = document.getElementById('generateBtn');
    if (isQuestionActive) {
        generateBtn.textContent = '問題生成';
    } else {
        generateBtn.textContent = '開始';
    }
}

function resetPlatformDisplay() {
    isQuestionActive = false;
    currentProblem = null;
    freeRetryProblem = null;
    isFreeRetrySession = false;
    isBatchRetrySession = false;
    batchRetryQueue = [];
    batchRetryOriginalIndices = [];
    batchRetryCurrentStep = 0;
    document.getElementById('questionText').style.display = 'none';
    document.getElementById('inputArea').style.display = 'none';
    document.getElementById('numpadArea').style.display = 'none';
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('summaryDashboard').style.display = 'none';
    document.getElementById('settingsCard').style.display = 'flex';
    document.getElementById('userAnswer').value = '';
    document.getElementById('exitBtn').style.display = 'none';
    updateGenerateButtonText();
}

function generateIntegerUniformDistanceProblem() {
    const v = getRandomItem(allowedSpeeds);
    const t = getRandomItem([3, 4, 6, 8, 10, 12, 15, 20, 24, 30]);
    const exactVal = (v * t) / 3.6;
    const isExact = Math.abs(exactVal - Math.round(exactVal)) < 1e-5;
    const distance = isExact ? Math.round(exactVal) : Math.ceil(exactVal);
    
    let calcAndAnswerHtml = '';
    if (isExact) {
        calcAndAnswerHtml = `<strong>【計算式】</strong><div class="math-block"><div class="calc-block"><div class="calc-row"><span class="calc-label">s</span><span class="calc-symbol">=</span><span class="calc-content">${createFractionHtml(v + ' &times; ' + t, '3.6')}</span></div><div class="calc-row"><span class="calc-label"></span><span class="calc-symbol">=</span><span class="calc-content">${distance} m</span></div></div></div><div style="margin-top:6px; font-weight:bold; color:var(--primary-color);">A: ${distance} m</div>`;
    } else {
        let decStr = formatDecimalString(exactVal);
        calcAndAnswerHtml = `<strong>【計算式】</strong><div class="math-block"><div class="calc-block"><div class="calc-row"><span class="calc-label">s</span><span class="calc-symbol">=</span><span class="calc-content">${createFractionHtml(v + ' &times; ' + t, '3.6')}</span></div><div class="calc-row"><span class="calc-label"></span><span class="calc-symbol">=</span><span class="calc-content">${decStr}</span></div><div class="calc-row"><span class="calc-label"></span><span class="calc-symbol">≒</span><span class="calc-content">${distance} m</span></div></div></div><div style="margin-top:6px; font-weight:bold; color:var(--primary-color);">A: ${distance} m</div>`;
    }

    return {
        type: 'distance_uniform',
        text: `${v} km/h で ${t} 秒間走行した場合の距離は？`,
        answer: distance,
        v: v,
        t: t,
        formula: `<strong>【使用する公式】</strong><div class="math-block">s = ${createFractionHtml('V &times; t', '3.6')}</div>`,
        calcAndAnswer: calcAndAnswerHtml
    };
}

function generateIntegerUniformSpeedProblem() {
    const v = getRandomItem(allowedSpeeds);
    const t = getRandomItem([3, 4, 5, 6, 8, 10, 12, 15, 20]);
    const distance = Math.round((v * t) / 3.6);
    const exactVal = (distance * 3.6) / t;
    const isExact = Math.abs(exactVal - v) < 1e-5;

    let calcAndAnswerHtml = '';
    if (isExact) {
        calcAndAnswerHtml = `<strong>【計算式】</strong><div class="math-block"><div class="calc-block"><div class="calc-row"><span class="calc-label">V</span><span class="calc-symbol">=</span><span class="calc-content">${createFractionHtml(distance + ' &times; 3.6', t)}</span></div><div class="calc-row"><span class="calc-label"></span><span class="calc-symbol">=</span><span class="calc-content">${v} km/h</span></div></div></div><div style="margin-top:6px; font-weight:bold; color:var(--primary-color);">A: ${v} km/h</div>`;
    } else {
        let decStr = formatDecimalString(exactVal);
        calcAndAnswerHtml = `<strong>【計算式】</strong><div class="math-block"><div class="calc-block"><div class="calc-row"><span class="calc-label">V</span><span class="calc-symbol">=</span><span class="calc-content">${createFractionHtml(distance + ' &times; 3.6', t)}</span></div><div class="calc-row"><span class="calc-label"></span><span class="calc-symbol">=</span><span class="calc-content">${decStr}</span></div><div class="calc-row"><span class="calc-label"></span><span class="calc-symbol">≒</span><span class="calc-content">${v} km/h</span></div></div></div><div style="margin-top:6px; font-weight:bold; color:var(--primary-color);">A: ${v} km/h</div>`;
    }

    return {
        type: 'speed_uniform',
        text: `${t} 秒間で ${distance} m 走行した時の速度は？ (単位: km/h)`,
        answer: v,
        distance: distance,
        t: t,
        formula: `<strong>【使用する公式】</strong><div class="math-block">V = ${createFractionHtml('s &times; 3.6', 't')}</div>`,
        calcAndAnswer: calcAndAnswerHtml
    };
}

function generateIntegerAccelProblem() {
    const rates = [1.0, 1.5, 2.0, 2.5, 3.0];
    const rate = getRandomItem(rates);
    const isDecel = Math.random() < 0.5;

    let v1 = getRandomItem(allowedSpeeds);
    let v2 = getRandomItem(allowedSpeeds);
    while (v1 === v2) {
        v2 = getRandomItem(allowedSpeeds);
    }

    if (isDecel) {
        if (v1 < v2) { let tmp = v1; v1 = v2; v2 = tmp; }
    } else {
        if (v1 > v2) { let tmp = v1; v1 = v2; v2 = tmp; }
    }

    let diffSq = isDecel ? ((v1 * v1) - (v2 * v2)) : ((v2 * v2) - (v1 * v1));
    let exactVal = diffSq / (7.2 * rate);
    let isExact = Math.abs(exactVal - Math.round(exactVal)) < 1e-5;
    let distance = isExact ? Math.round(exactVal) : Math.ceil(exactVal);
    let rateStr = rate.toFixed(1);

    let fracHtml = isDecel ? createFractionHtml(v1 + '<sup>2</sup> - ' + v2 + '<sup>2</sup>', '7.2 &times; ' + rateStr) : createFractionHtml(v2 + '<sup>2</sup> - ' + v1 + '<sup>2</sup>', '7.2 &times; ' + rateStr);

    let calcAndAnswerHtml = '';
    if (isExact) {
        calcAndAnswerHtml = `<strong>【計算式】</strong><div class="math-block"><div class="calc-block"><div class="calc-row"><span class="calc-label">s</span><span class="calc-symbol">=</span><span class="calc-content">${fracHtml}</span></div><div class="calc-row"><span class="calc-label"></span><span class="calc-symbol">=</span><span class="calc-content">${distance} m</span></div></div></div><div style="margin-top:6px; font-weight:bold; color:var(--primary-color);">A: ${distance} m</div>`;
    } else {
        let decStr = formatDecimalString(exactVal);
        calcAndAnswerHtml = `<strong>【計算式】</strong><div class="math-block"><div class="calc-block"><div class="calc-row"><span class="calc-label">s</span><span class="calc-symbol">=</span><span class="calc-content">${fracHtml}</span></div><div class="calc-row"><span class="calc-label"></span><span class="calc-symbol">=</span><span class="calc-content">${decStr}</span></div><div class="calc-row"><span class="calc-label"></span><span class="calc-symbol">≒</span><span class="calc-content">${distance} m</span></div></div></div><div style="margin-top:6px; font-weight:bold; color:var(--primary-color);">A: ${distance} m</div>`;
    }

    if (isDecel) {
        return {
            type: 'accel',
            isDecel: true,
            text: `減速度 &beta; = ${rateStr} km/h/s で ${v1} km/h から ${v2} km/h まで減速した場合の距離は？`,
            answer: distance,
            v0: v1,
            v1: v2,
            alpha: rate,
            formula: `<strong>【使用する公式】</strong><div class="math-block">s = <br>${createFractionHtml('V<sub>1</sub><sup>2</sup> - V<sub>2</sub><sup>2</sup>', '7.2 &times; &beta;')}</div>`,
            calcAndAnswer: calcAndAnswerHtml
        };
    } else {
        return {
            type: 'accel',
            isDecel: false,
            text: `加速度 &alpha; = ${rateStr} km/h/s で ${v1} km/h から ${v2} km/h まで加速した場合の距離は？`,
            answer: distance,
            v0: v1,
            v1: v2,
            alpha: rate,
            formula: `<strong>【使用する公式】</strong><div class="math-block">s = <br>${createFractionHtml('V<sub>2</sub><sup>2</sup> - V<sub>1</sub><sup>2</sup>', '7.2 &times; &alpha;')}</div>`,
            calcAndAnswer: calcAndAnswerHtml
        };
    }
}

function generateIntegerEmergencyProblem() {
    let v1 = getRandomItem(allowedSpeeds);
    let t_idle = 1;
    let b = emergencyDecel;
    
    let exactTotal = (v1 * t_idle / 3.6) + ((v1 * v1) / (7.2 * b));
    let totalDistRounded = Math.ceil(exactTotal);

    let addExtra = getRandomItem([25, 35, 45, 55, 65, 75, 85]);
    let targetPoint = totalDistRounded + addExtra;
    let remaining = targetPoint - totalDistRounded;

    let decTotal = formatDecimalString(exactTotal);

    let totalDistRows = `
        <div class="calc-row"><span class="calc-label">総停止距離(s)</span><span class="calc-symbol">=</span><span class="calc-content">${createFractionHtml('V<sub>1</sub> &times; t<sub>0</sub>', '3.6')} + ${createFractionHtml('V<sub>1</sub><sup>2</sup>', '7.2 &times; &beta;')}</span></div>
        <div class="calc-row"><span class="calc-label"></span><span class="calc-symbol">=</span><span class="calc-content">${createFractionHtml(v1 + ' &times; 1', '3.6')} + ${createFractionHtml(v1 + '<sup>2</sup>', '7.2 &times; 4.5')}</span></div>
        <div class="calc-row"><span class="calc-label"></span><span class="calc-symbol">=</span><span class="calc-content">${decTotal}</span></div>
        <div class="calc-row"><span class="calc-label"></span><span class="calc-symbol">≒</span><span class="calc-content">${totalDistRounded} m（切り上げ）</span></div>
    `;

    let remainingRows = `
        <div class="calc-row"><span class="calc-label">手前距離</span><span class="calc-symbol">=</span><span class="calc-content">${targetPoint} - ${totalDistRounded}</span></div>
        <div class="calc-row"><span class="calc-label"></span><span class="calc-symbol">=</span><span class="calc-content">${remaining} m手前</span></div>
    `;

    let calcAndAnswerHtml = `<strong>【計算式】</strong><div class="math-block"><div class="calc-block">${totalDistRows}${remainingRows}</div></div><div style="margin-top:6px; font-weight:bold; color:var(--primary-color);">A: ${remaining} m</div>`;

    return {
        type: 'emergency',
        text: `${v1} km/h で走行中、前方 ${targetPoint} m 先で異常を認め非常制動（減速度 &beta; = 4.5 km/h/s）を使用して停止した。この場合何 m 手前で停止できるか？ただし空走時間は ${t_idle} 秒とする。`,
        answer: remaining,
        v0: v1,
        targetPoint: targetPoint,
        totalDist: totalDistRounded,
        formula: `<strong>【使用する公式】</strong><div class="math-block">s = ${createFractionHtml('V<sub>1</sub> &times; t<sub>0</sub>', '3.6')} + ${createFractionHtml('V<sub>1</sub><sup>2</sup>', '7.2 &times; &beta;')}</div>`,
        calcAndAnswer: calcAndAnswerHtml
    };
}

function getSelectedTypes() {
    const typeButtons = document.querySelectorAll('#typeButtonGroup .select-btn');
    let selected = [];
    typeButtons.forEach(btn => {
        if (btn.classList.contains('active') && btn.getAttribute('data-type') !== 'all') {
            selected.push(btn.getAttribute('data-type'));
        }
    });
    return selected;
}

function createSingleProblemFromSelection() {
    let selectedTypes = getSelectedTypes();
    if (selectedTypes.length === 0) {
        selectedTypes = ['distance_uniform', 'speed_uniform', 'accel', 'emergency'];
    }
    let selectedType = getRandomItem(selectedTypes);

    switch (selectedType) {
        case 'distance_uniform':
            return generateIntegerUniformDistanceProblem();
        case 'speed_uniform':
            return generateIntegerUniformSpeedProblem();
        case 'accel':
            return generateIntegerAccelProblem();
        case 'emergency':
            return generateIntegerEmergencyProblem();
    }
}

function getSelectedCount() {
    const activeCountBtn = document.querySelector('#countButtonGroup .select-btn.active');
    if (activeCountBtn) {
        return parseInt(activeCountBtn.getAttribute('data-count'), 10);
    }
    const customInput = document.getElementById('customCountInput');
    let val = parseInt(customInput.value, 10);
    if (isNaN(val) || val <= 0) {
        return 5;
    }
    return val;
}

function startPlatform() {
    currentMode = document.querySelector('#modeButtonGroup .select-btn.active').getAttribute('data-mode');

    document.getElementById('summaryDashboard').style.display = 'none';
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('settingsCard').style.display = 'none';
    document.getElementById('questionText').style.display = 'block';
    
    if (currentMode === 'practice') {
        document.getElementById('inputArea').style.display = 'flex';
        document.getElementById('numpadArea').style.display = 'grid';
        document.getElementById('exitBtn').style.display = 'block';
        isQuestionActive = true;
        isFreeRetrySession = false;
        isBatchRetrySession = false;
        freeRetryProblem = null;
        updateGenerateButtonText();

        currentProblem = createSingleProblemFromSelection();
        document.getElementById('questionText').innerHTML = currentProblem.text;
    } else {
        const count = getSelectedCount();
        practiceList = [];
        for (let i = 0; i < count; i++) {
            practiceList.push(createSingleProblemFromSelection());
        }
        practiceIndex = 0;
        practiceResults = [];

        document.getElementById('inputArea').style.display = 'flex';
        document.getElementById('numpadArea').style.display = 'grid';
        document.getElementById('exitBtn').style.display = 'block';
        isQuestionActive = true;
        isFreeRetrySession = false;
        isBatchRetrySession = false;
        freeRetryProblem = null;
        updateGenerateButtonText();

        loadExamQuestion();
    }
}

function loadExamQuestion() {
    currentProblem = practiceList[practiceIndex];
    document.getElementById('questionText').innerHTML = `<strong>【第 ${practiceIndex + 1} 問 / 全 ${practiceList.length} 問】</strong><br>` + currentProblem.text;
    document.getElementById('userAnswer').value = '';
}

function checkAnswer() {
    const userAnsVal = document.getElementById('userAnswer').value;
    if (userAnsVal === "") {
        alert("数値を入力するか、計算結果を求めてください。");
        return;
    }

    let userAns;
    try {
        let sanitized = userAnsVal.replace(/[^0-9\+\-\*/().]/g, '');
        userAns = Number(eval(sanitized));
    } catch (e) {
        alert("正しい数値を入力してください。");
        return;
    }

    if (currentMode === 'practice') {
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const explanationText = document.getElementById('explanationText');
        const nextBtn = document.getElementById('nextBtn');
        const retrySameBtn = document.getElementById('retrySameBtn');

        resultBox.style.display = 'block';
        
        let targetProb = isFreeRetrySession ? freeRetryProblem : currentProblem;
        let isCorrect = Math.abs(userAns - targetProb.answer) < 0.1;

        if (isFreeRetrySession) {
            if (isCorrect) {
                resultBox.className = 'result-box';
                resultBox.style.backgroundColor = 'var(--retry-success-bg)';
                resultBox.style.color = 'var(--retry-success-color)';
                resultBox.style.border = '1px solid var(--retry-success-border)';
                resultTitle.textContent = '再挑戦：○ 正解';
            } else {
                resultBox.className = 'result-box incorrect';
                resultBox.style.backgroundColor = '';
                resultBox.style.color = '';
                resultBox.style.border = '';
                resultTitle.textContent = '再挑戦：✕ 不正解';
            }
        } else {
            if (isCorrect) {
                resultBox.className = 'result-box correct';
                resultTitle.textContent = '◎ 正解';
            } else {
                resultBox.className = 'result-box incorrect';
                resultTitle.textContent = '✕ 不正解';
            }
        }

        nextBtn.style.display = 'block';
        retrySameBtn.style.display = 'block';

        if (isCorrect) {
            explanationText.innerHTML = `${targetProb.formula}${targetProb.calcAndAnswer}`;
        } else {
            explanationText.innerHTML = `${targetProb.formula}<button class="btn btn-reveal" id="revealBtn">計算式と解答を表示</button><div id="hiddenCalcContainer" style="display:none;">${targetProb.calcAndAnswer}</div>`;
            const revealBtn = document.getElementById('revealBtn');
            revealBtn.addEventListener('click', () => {
                document.getElementById('hiddenCalcContainer').style.display = 'block';
                revealBtn.style.display = 'none';
            });
        }

        requestAnimationFrame(() => {
            drawChart('vtChart', targetProb);
        });

        resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });

    } else {
        let isCorrect = Math.abs(userAns - currentProblem.answer) < 0.1;

        if (isBatchRetrySession) {
            let origIdx = batchRetryOriginalIndices[batchRetryCurrentStep];
            let resObj = practiceResults[origIdx];

            resObj.retryCorrect = isCorrect;

            if (!resObj.retryHistory) {
                resObj.retryHistory = [];
            }
            resObj.retryHistory.push({
                userAns: userAns,
                isCorrect: isCorrect
            });

            batchRetryCurrentStep++;
            if (batchRetryCurrentStep < batchRetryQueue.length) {
                loadExamQuestion();
            } else {
                isBatchRetrySession = false;
                showExamSummary();
            }
        } else {
            practiceResults.push({
                question: currentProblem,
                userAns: userAns,
                isCorrect: isCorrect,
                retryCorrect: null,
                retryHistory: []
            });

            practiceIndex++;
            if (practiceIndex < practiceList.length) {
                loadExamQuestion();
            } else {
                showExamSummary();
            }
        }
    }
}

function updateScoreCard() {
    const correctCount = practiceResults.filter(r => r.isCorrect || r.retryCorrect === true).length;
    const total = practiceResults.length;
    document.getElementById('scoreCardText').textContent = `結果： ${total}問中 ${correctCount}問正解 （正答率: ${Math.round((correctCount/total)*100)}%）`;
}

function renderResultGrid() {
    const grid = document.getElementById('resultGrid');
    grid.innerHTML = '';

    practiceResults.forEach((res, idx) => {
        const badge = document.createElement('div');
        let statusClass = res.isCorrect ? 'correct' : 'incorrect';
        let mark = res.isCorrect ? '◎' : '✕';
        
        if (!res.isCorrect && res.retryCorrect === true) {
            statusClass = 'retry-correct';
            mark = '○';
        } else if (!res.isCorrect && res.retryCorrect === false) {
            mark = '✕';
        }

        badge.className = `result-item-badge ${statusClass}`;
        badge.textContent = `${idx + 1}問 [${mark}]`;
        badge.addEventListener('click', () => {
            showExamDetail(idx);
        });
        grid.appendChild(badge);
    });

    const retryWrongBtn = document.getElementById('retryWrongBtn');
    const hasIncorrect = practiceResults.some(r => !r.isCorrect && r.retryCorrect !== true);
    if (hasIncorrect && currentMode === 'exam') {
        retryWrongBtn.style.display = 'block';
    } else {
        retryWrongBtn.style.display = 'none';
    }
}

function showExamSummary() {
    document.getElementById('questionText').style.display = 'none';
    document.getElementById('inputArea').style.display = 'none';
    document.getElementById('numpadArea').style.display = 'none';
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('exitBtn').style.display = 'none';

    const dashboard = document.getElementById('summaryDashboard');
    dashboard.style.display = 'block';

    updateScoreCard();
    renderResultGrid();
    showExamDetail(0);
    dashboard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function drawChart(canvasId, prob) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);

    const width = rect.width;
    const height = rect.height;

    ctx.clearRect(0, 0, width, height);

    const paddingLeft = 35;
    const paddingRight = 15;
    const paddingTop = 25;
    const paddingBottom = 35;

    const chartWidth = width - paddingLeft - paddingRight;
    const chartHeight = height - paddingTop - paddingBottom;

    let maxV = 100;
    let rawMaxT = 60;

    if (prob.type === 'distance_uniform') {
        rawMaxT = prob.t;
    } else if (prob.type === 'speed_uniform') {
        rawMaxT = prob.t;
    } else if (prob.type === 'accel') {
        rawMaxT = Math.abs(prob.v1 - prob.v0) / prob.alpha;
    } else if (prob.type === 'emergency') {
        rawMaxT = 1 + (prob.v0 / emergencyDecel);
    }

    let maxT = rawMaxT || 60;

    function getX(t) {
        return paddingLeft + (t / maxT) * chartWidth;
    }
    function getY(v) {
        return paddingTop + chartHeight - (v / maxV) * chartHeight;
    }

    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    ctx.fillStyle = '#666';
    ctx.font = '10px sans-serif';

    for (let v = 0; v <= maxV; v += 25) {
        let y = getY(v);
        ctx.beginPath();
        ctx.moveTo(paddingLeft, y);
        ctx.lineTo(width - paddingRight, y);
        ctx.stroke();

        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(v, paddingLeft - 6, y);
    }

    let stepT = maxT > 60 ? 20 : 10;
    for (let t = 0; t <= maxT; t += stepT) {
        let x = getX(t);
        ctx.beginPath();
        ctx.moveTo(x, paddingTop);
        ctx.lineTo(x, height - paddingBottom);
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(t, x, height - paddingBottom + 5);
    }

    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(paddingLeft, paddingTop);
    ctx.lineTo(paddingLeft, height - paddingBottom);
    ctx.moveTo(paddingLeft, height - paddingBottom);
    ctx.lineTo(width - paddingRight, height - paddingBottom);
    ctx.stroke();

    ctx.fillStyle = '#202124';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('速度', 5, paddingTop - 10);
    ctx.textAlign = 'right';
    ctx.fillText('時間(s)', width - paddingRight, height - paddingBottom + 18);

    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 3;
    ctx.beginPath();

    if (prob.type === 'distance_uniform') {
        let x0 = getX(0);
        let y0 = getY(prob.v);
        let x1 = getX(prob.t);
        let y1 = getY(prob.v);
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
    } else if (prob.type === 'speed_uniform') {
        let v_kmh = prob.answer;
        let x0 = getX(0);
        let y0 = getY(v_kmh);
        let x1 = getX(prob.t);
        let y1 = getY(v_kmh);
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
    } else if (prob.type === 'accel') {
        let t_accel = Math.abs(prob.v1 - prob.v0) / prob.alpha;
        let x0 = getX(0);
        let y0 = getY(prob.v0);
        let x1 = getX(t_accel);
        let y1 = getY(prob.v1);
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
    } else if (prob.type === 'emergency') {
        let v0 = prob.v0;
        let x_start = getX(0);
        let y_start = getY(v0);
        let x_idle = getX(1);
        let y_idle = getY(v0);

        let tBrakeEnd = 1 + (v0 / emergencyDecel);
        let x_end = getX(tBrakeEnd);
        let y_end = getY(0);

        ctx.moveTo(x_start, y_start);
        ctx.lineTo(x_idle, y_idle);
        ctx.lineTo(x_end, y_end);
    }
    ctx.stroke();
}

    const typeButtons = document.querySelectorAll('#typeButtonGroup .select-btn');
    const allRangeBtn = document.querySelector('#typeButtonGroup .select-btn[data-type="all"]');
    const itemTypeButtons = document.querySelectorAll('#typeButtonGroup .select-btn:not([data-type="all"])');
    
    const countButtons = document.querySelectorAll('#countButtonGroup .select-btn');
    const customCountInput = document.getElementById('customCountInput');
    const customCountWrapper = document.getElementById('customCountWrapper');
    const countRow = document.getElementById('countRow');

    const generateBtn = document.getElementById('generateBtn');
    const submitBtn = document.getElementById('submitBtn');
    const nextBtn = document.getElementById('nextBtn');
    const retrySameBtn = document.getElementById('retrySameBtn');
    const practiceExitBtn = document.getElementById('practiceExitBtn');
    const retryWrongBtn = document.getElementById('retryWrongBtn');
    const detailRetryBtn = document.getElementById('detailRetryBtn');
    const exitBtn = document.getElementById('exitBtn');
    const userAnswerInput = document.getElementById('userAnswer');

    if (exitBtn) {
        exitBtn.style.display = 'none';
    }

    modeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            modeButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.getAttribute('data-mode');

            if (currentMode === 'practice') {
                countRow.style.display = 'none';
            } else {
                countRow.style.display = 'flex';
            }
            resetPlatformDisplay();
        });
    });

    typeButtons.forEach(b => { b.disabled = false; });
    countRow.style.display = 'none';

    allRangeBtn.addEventListener('click', () => {
        if (allRangeBtn.disabled) return;
        typeButtons.forEach(b => b.classList.remove('active'));
        allRangeBtn.classList.add('active');
    });

    itemTypeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            if (btn.disabled) return;
            allRangeBtn.classList.remove('active');
            btn.classList.toggle('active');

            const activeItems = document.querySelectorAll('#typeButtonGroup .select-btn:not([data-type="all"]).active');
            if (activeItems.length === 0) {
                allRangeBtn.classList.add('active');
            }
        });
    });

    countButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            countButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            customCountWrapper.classList.remove('active');
            customCountInput.value = '';
        });
    });

    customCountWrapper.addEventListener('click', () => {
        countButtons.forEach(b => b.classList.remove('active'));
        customCountWrapper.classList.add('active');
        customCountInput.value = '';
        customCountInput.focus();
    });

    customCountInput.addEventListener('focus', () => {
        countButtons.forEach(b => b.classList.remove('active'));
        customCountWrapper.classList.add('active');
        customCountInput.value = '';
    });

    customCountInput.addEventListener('input', () => {
        if (customCountInput.value !== '') {
            countButtons.forEach(b => b.classList.remove('active'));
            customCountWrapper.classList.add('active');
        }
    });

    if (generateBtn) {
        generateBtn.addEventListener('click', startPlatform);
    }

    if (exitBtn) {
        exitBtn.addEventListener('click', resetPlatformDisplay);
    }

    if (practiceExitBtn) {
        practiceExitBtn.addEventListener('click', resetPlatformDisplay);
    }

    if (submitBtn) {
        submitBtn.addEventListener('click', () => {
            if (currentMode === 'practice') {
                checkAnswer();
            } else {
                if (isFreeRetrySession) {
                    const userAnsVal = userAnswerInput.value;
                    if (userAnsVal === "") {
                        alert("数値を入力するか、計算結果を求めてください。");
                        return;
                    }
                    let userAns;
                    try {
                        let sanitized = userAnsVal.replace(/[^0-9\+\-\*/().]/g, '');
                        userAns = Number(eval(sanitized));
                    } catch (e) {
                        alert("正しい数値を入力してください。");
                        return;
                    }

                    const res = practiceResults[currentDetailIndex];
                    let isCorrect = Math.abs(userAns - res.question.answer) < 0.1;

                    res.retryCorrect = isCorrect;

                    if (!res.retryHistory) {
                        res.retryHistory = [];
                    }
                    res.retryHistory.push({
                        userAns: userAns,
                        isCorrect: isCorrect
                    });

                    document.getElementById('questionText').style.display = 'none';
                    document.getElementById('inputArea').style.display = 'none';
                    document.getElementById('numpadArea').style.display = 'none';
                    document.getElementById('resultBox').style.display = 'none';
                    document.getElementById('exitBtn').style.display = 'none';

                    const dashboard = document.getElementById('summaryDashboard');
                    dashboard.style.display = 'block';

                    updateScoreCard();
                    renderResultGrid();
                    showExamDetail(currentDetailIndex);
                    dashboard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    isFreeRetrySession = false;
                } else {
                    checkAnswer();
                }
            }
        });
    }

    if (detailRetryBtn) {
        detailRetryBtn.addEventListener('click', () => {
            if (currentDetailIndex === null) return;
            const res = practiceResults[currentDetailIndex];
            
            document.getElementById('summaryDashboard').style.display = 'none';
            document.getElementById('questionText').style.display = 'block';
            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('numpadArea').style.display = 'grid';
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('exitBtn').style.display = 'block';
            
            isFreeRetrySession = true;
            freeRetryProblem = res.question;
            currentProblem = res.question;
            
            document.getElementById('questionText').innerHTML = `<strong>【問題の再挑戦】</strong><br>` + res.question.text;
            userAnswerInput.value = '';
            document.getElementById('questionText').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    }

    if (retrySameBtn) {
        retrySameBtn.addEventListener('click', () => {
            document.getElementById('resultBox').style.display = 'none';
            userAnswerInput.value = '';
            isFreeRetrySession = false;
            document.getElementById('questionText').innerHTML = currentProblem.text;
            document.getElementById('questionText').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    }

    if (nextBtn) {
        nextBtn.addEventListener('click', () => {
            document.getElementById('resultBox').style.display = 'none';
            userAnswerInput.value = '';
            isFreeRetrySession = false;
            freeRetryProblem = null;
            currentProblem = createSingleProblemFromSelection();
            document.getElementById('questionText').innerHTML = currentProblem.text;
            document.getElementById('questionText').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    }

    if (retryWrongBtn) {
        retryWrongBtn.addEventListener('click', () => {
            batchRetryQueue = [];
            batchRetryOriginalIndices = [];

            practiceResults.forEach((res, idx) => {
                if (!res.isCorrect && res.retryCorrect !== true) {
                    batchRetryQueue.push(res.question);
                    batchRetryOriginalIndices.push(idx);
                }
            });

            if (batchRetryQueue.length > 0) {
                isBatchRetrySession = true;
                batchRetryCurrentStep = 0;

                document.getElementById('summaryDashboard').style.display = 'none';
                document.getElementById('questionText').style.display = 'block';
                document.getElementById('inputArea').style.display = 'flex';
                document.getElementById('numpadArea').style.display = 'grid';
                document.getElementById('resultBox').style.display = 'none';
                document.getElementById('exitBtn').style.display = 'block';

                loadExamQuestion();
                document.getElementById('questionText').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    }

    const numpadButtons = document.querySelectorAll('.num-btn');
    numpadButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            const val = btn.getAttribute('data-val');
            if (val === 'clear') {
                userAnswerInput.value = '';
            } else if (val === 'back') {
                userAnswerInput.value = userAnswerInput.value.slice(0, -1);
            } else if (val === 'calc') {
                try {
                    let sanitized = userAnswerInput.value.replace(/[^0-9\+\-\*/().]/g, '');
                    if (sanitized !== '') {
                        let evaluated = eval(sanitized);
                        userAnswerInput.value = evaluated;
                    }
                } catch (e) {
                    alert("計算式の値が無効です。");
                }
            } else {
                userAnswerInput.value += val;
            }
        });
    });
});
</script>

</body>
</html>
